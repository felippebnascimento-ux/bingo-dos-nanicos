.ganho{display:flex;gap:10px;align-items:center;background:rgba(30,30,29,.92);border-left:3px solid #B08D57;border-radius:10px;padding:8px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.3)}

.seta{position:absolute;font:700 11px Onest,sans-serif;color:#262626;background:#F2E6C9;border-radius:6px;padding:3px 8px}
</style></head><body>
<svg id="s" width="1400" height="900"><defs><clipPath id="clipJanela"><polygon id="clipPoly"/></clipPath>
<linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8EC6EA"/><stop offset=".7" stop-color="#CFE8F2"/><stop offset="1" stop-color="#E9F2E2"/></linearGradient></defs></svg>
<div id="bonecos"></div>
<h1>Sítio do Mitz</h1>
<script>
const BON="../assets/bonecos/",ROSTO="../../public/arte/nanicos/";
const svg=document.getElementById("s"),NS="http://www.w3.org/2000/svg";
// sala maior: 14 x 11 pisos (antes 11 x 9)
const X0=700,Y0=318,TW=40,TH=20,NI=14,NJ=11,WH=215;
const p=(i,j,z=0)=>[X0+(i-j)*TW,Y0+(i+j)*TH-z];
const el=(tag,attrs,pai=svg)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);pai.appendChild(e);return e};
const pts=a=>a.map(q=>q.join(",")).join(" ");
const poly=(a,fill,stroke,sw=1,pai=svg)=>el("polygon",{points:pts(a),fill,stroke:stroke||"none","stroke-width":sw,"stroke-linejoin":"round"},pai);
let semente=11;const rnd=()=>(semente=(semente*16807)%2147483647)/2147483647;
const escurece=(h,f)=>{const n=parseInt(h.slice(1),16);const m=v=>Math.max(0,Math.min(255,Math.round(v*f)));return"#"+((1<<24)|(m(n>>16)<<16)|(m(n>>8&255)<<8)|m(n&255)).toString(16).slice(1)};
function caixa(i,j,w,d,h,topo,esq,dir,z=0,linha="#3a2e25"){
  poly([p(i,j+d,z),p(i+w,j+d,z),p(i+w,j+d,z+h),p(i,j+d,z+h)],esq,linha);
  poly([p(i+w,j,z),p(i+w,j+d,z),p(i+w,j+d,z+h),p(i+w,j,z+h)],dir,linha);
  poly([p(i,j,z+h),p(i+w,j,z+h),p(i+w,j+d,z+h),p(i,j+d,z+h)],topo,linha);
}
const naParedeP=(lado,a,b,z0,z1)=>lado==="dir"?[p(a,0,z0),p(b,0,z0),p(b,0,z1),p(a,0,z1)]:[p(0,a,z0),p(0,b,z0),p(0,b,z1),p(0,a,z1)];
const naParede=(lado,a,b,z0,z1,fill,stroke,sw,pai)=>poly(naParedeP(lado,a,b,z0,z1),fill,stroke,sw,pai);

// ---------- paredes de tijolinho, mais claras e quentes
const TIJ=["#F0DDB4","#E9D2A2","#F3E4C1","#E6CC98","#EED8AA"],VERM="#D99A72";
function tijolos(lado,n){
  naParede(lado,0,n,0,WH,"#DCCBA6");
  for(let r=0,z=0;z<WH;r++,z+=9){
    for(let a=(r%2?-.25:0);a<n;a+=.5){
      const a0=Math.max(0,a),a1=Math.min(n,a+.5);if(a1<=a0)continue;
      const cor=rnd()<.07?VERM:TIJ[Math.floor(rnd()*TIJ.length)];
      naParede(lado,a0+.03,a1-.03,z+1,Math.min(WH,z+8),lado==="dir"?cor:escurece(cor,.95));
    }
  }
  naParede(lado,0,n,150,162,lado==="dir"?"#A3AAB0":"#959CA2","#6d7378");
  for(const a of lado==="dir"?[4.9,10.6]:[4.6,8.7])naParede(lado,a,a+.32,0,WH,lado==="dir"?"#A3AAB0":"#959CA2","#6d7378");
  naParede(lado,0,n,0,6,lado==="dir"?"#AFA38B":"#A3977F");
}
tijolos("esq",NJ);tijolos("dir",NI);
for(const lado of["esq","dir"]){
  const n=lado==="dir"?NI:NJ;
  naParede(lado,0,n,WH,WH+34,lado==="dir"?"#9C6A42":"#8B5D38","#5b3a22");
  for(let a=.35;a<n;a+=.35)naParede(lado,a,a+.02,WH,WH+34,"#6b4428");
  naParede(lado,0,n,WH+26,WH+38,"#7A4E2E","#3f2716");
}
poly([p(0,0,0),p(0,0,WH+38),[p(0,0)[0]+3,p(0,0,WH+38)[1]],[p(0,0)[0]+3,p(0,0)[1]]],"#7d7568");

// ---------- janelão com árvores (parede do fundo, a da direita)
const JA=1.0,JB=4.4,JZ0=52,JZ1=178;
naParede("dir",JA-.12,JB+.12,JZ0-10,JZ1+10,"#8A6A45","#5b3a22",2);
document.getElementById("clipPoly").setAttribute("points",pts(naParedeP("dir",JA,JB,JZ0,JZ1)));
const paisagem=el("g",{"clip-path":"url(#clipJanela)"});
{const[x0,y0]=p(JA,0,JZ1+10),[x1,y1]=p(JB,0,JZ0-10);
 el("rect",{x:x0-10,y:y0-10,width:x1-x0+20,height:y1-y0+60,fill:"url(#ceu)"},paisagem);
 el("circle",{cx:x0+40,cy:y0+40,r:16,fill:"#FFF3C4",opacity:.9},paisagem);
 // morro e gramado
 el("ellipse",{cx:(x0+x1)/2,cy:y1+30,rx:(x1-x0)*.8,ry:85,fill:"#9CCB6E"},paisagem);
 el("ellipse",{cx:x0+30,cy:y1+10,rx:120,ry:60,fill:"#86BC5C"},paisagem);
 // árvores
 const arvore=(x,y,r,c1,c2)=>{el("rect",{x:x-3,y:y,width:6,height:r*1.3,fill:"#6B4A2E"},paisagem);
   el("circle",{cx:x,cy:y-r*.2,r,fill:c1},paisagem);el("circle",{cx:x-r*.55,cy:y+r*.15,r:r*.7,fill:c2},paisagem);el("circle",{cx:x+r*.6,cy:y+r*.1,r:r*.72,fill:c1},paisagem);el("circle",{cx:x-r*.1,cy:y-r*.75,r:r*.6,fill:c2},paisagem)};
 arvore(x0+70,y0+95,24,"#4E8F3A","#63A64A");arvore(x0+115,y0+112,18,"#3F7F33","#5C9B45");
 arvore(x0+168,y0+128,28,"#4E8F3A","#69AE4D");arvore(x1-40,y1-34,20,"#3F7F33","#5C9B45");arvore(x1-10,y1-12,26,"#4E8F3A","#63A64A");
}
// caixilho: divisões
for(const a of[JA+(JB-JA)/3,JA+2*(JB-JA)/3])naParede("dir",a-.04,a+.04,JZ0,JZ1,"#8A6A45");
naParede("dir",JA,JB,(JZ0+JZ1)/2-2,(JZ0+JZ1)/2+2,"#8A6A45");
naParede("dir",JA-.2,JB+.2,JZ0-14,JZ0-8,"#A57E52","#5b3a22"); // peitoril
// cortina de cada lado
naParede("dir",JA-.42,JA-.14,JZ0-6,JZ1+16,"#E7B65A","#B98A35");naParede("dir",JB+.14,JB+.42,JZ0-6,JZ1+16,"#E7B65A","#B98A35");

// ---------- coisas na parede da esquerda
// TV (Ao vivo): ligada mostrando a live
naParede("esq",1.1,3.0,90,150,"#111","#000",2);
naParede("esq",1.18,2.92,94,146,"#4C5FA8");naParede("esq",1.18,2.92,94,112,"#7E6BC4");naParede("esq",1.75,2.35,110,128,"#C4A06A");
naParede("esq",2.0,2.12,58,90,"#222");
// prateleira com plantinha
naParede("esq",3.5,4.3,96,100,"#8A6A45");
{const[x,y]=p(0,3.9,100);el("rect",{x:x-7,y:y-14,width:14,height:14,rx:2,fill:"#C9774E"});el("circle",{cx:x-5,cy:y-20,r:8,fill:"#5C9B45"});el("circle",{cx:x+5,cy:y-22,r:8,fill:"#4E8F3A"})}
// porta de vidro (Resenha, fase 05)
naParede("esq",5.4,7.6,0,140,"#5B4A3A","#3a2e25",3);
naParede("esq",5.5,7.5,4,136,"#B6DCA9");naParede("esq",5.5,7.5,4,60,"#7FB86A");naParede("esq",6.0,6.7,60,128,"#5E9A4A");
naParede("esq",6.48,6.52,4,136,"#5B4A3A");
// janelas velhas penduradas (decoração)
for(const[a,b]of[[1.3,2.1],[2.5,3.2]]){naParede("esq",a,b,172,208,"none","#8A6A45",4);naParede("esq",(a+b)/2-.02,(a+b)/2+.02,172,208,"#8A6A45");naParede("esq",a,b,189,191,"#8A6A45")}

// ---------- parede da direita: relógio, quadro, portão K-FOFO
{const[cx,cy]=p(6.0,0,140);el("ellipse",{cx,cy:cy+9,rx:15,ry:17,fill:"#F4F1EA",stroke:"#2b2b2b","stroke-width":3});
 el("line",{x1:cx,y1:cy+9,x2:cx+1,y2:cy-2,stroke:"#2b2b2b","stroke-width":2});el("line",{x1:cx,y1:cy+9,x2:cx+8,y2:cy+11,stroke:"#2b2b2b","stroke-width":2})}
for(const[a,b]of[[5.4,6.5],[11.4,12.4]]){naParede("dir",a,b,176,210,"none","#8A6A45",4);naParede("dir",(a+b)/2-.02,(a+b)/2+.02,176,210,"#8A6A45")}
naParede("dir",11.1,13.6,0,138,"#8B6B4A","#5b3a22",2);
for(let a=11.3;a<13.6;a+=.22)naParede("dir",a,a+.02,0,138,"#5b3a22");
naParede("dir",11.8,12.9,144,160,"#5E4630","#3a2a1c",2);
{const[sx,sy]=p(12.35,0,151);const t=el("text",{x:sx,y:sy+4,"text-anchor":"middle","font-family":"Unbounded,sans-serif","font-weight":"700","font-size":"11",fill:"#F1E8D9",transform:`rotate(26.6 ${sx} ${sy})`});t.textContent="K-FOFO 2018"}

// ---------- piso: lajota clara e quente
for(let i=0;i<NI;i++)for(let j=0;j<NJ;j++)poly([p(i,j),p(i+1,j),p(i+1,j+1),p(i,j+1)],(i+j)%2?"#F1ECE1":"#E7E0D2","#D4CCBB");
// sol entrando pelo janelão
poly([p(JA+.6,0),p(JB+.9,0),p(JB+2.2,3.2),p(JA+1.6,3.2)],"rgba(255,231,160,.28)");
// tapete listrado perto da porta de vidro
poly([p(1.2,5.2),p(3.4,5.2),p(3.4,8.2),p(1.2,8.2)],"#C9B286","#9f8a62");
for(let k=0;k<6;k++)poly([p(1.2,5.4+k*.5),p(3.4,5.4+k*.5),p(3.4,5.6+k*.5),p(1.2,5.6+k*.5)],"#AE9568");

// ---------- móveis (de trás para a frente)
// churrasqueira
caixa(7.0,0,2.2,1.1,88,"#C4A582","#D2AF88","#E0C198");
poly([p(7.35,1.1,22),p(8.85,1.1,22),p(8.85,1.1,70),p(7.35,1.1,70)],"#141414","#000");
for(let k=0;k<4;k++)poly([p(7.4,1.1,30+k*9),p(8.8,1.1,30+k*9),p(8.8,1.1,32+k*9),p(7.4,1.1,32+k*9)],"#555");
caixa(7.3,0,1.6,.7,60,"#D2AF88","#D2AF88","#E0C198",88);
caixa(7.6,0,1.0,.45,WH-148,"#C8A984","#C8A984","#D6B88F",148);
// loja: geladeira e freezer brancos (frente da parede da esquerda)
caixa(0,8.9,.9,.95,96,"#F7F7F5","#E4E4E1","#F2F2F0",0,"#9a9a96");
poly([p(0,9.85,62),p(.9,9.85,62)],"none","#9a9a96");
caixa(0,9.95,.9,1.0,60,"#F7F7F5","#E4E4E1","#F2F2F0",0,"#9a9a96");
{const[x,y]=p(.9,9.3,70);el("rect",{x:x-2,y:y-6,width:4,height:22,rx:2,fill:"#B9B9B5"})}
// colchão azul (fundo)
function colchao(i,j,w,d){caixa(i,j,w,d,9,"#4A68B8","#3A5598","#405DA6",0,"#1f2f5c");for(let a=i+.3;a<i+w;a+=.45)for(let b=j+.25;b<j+d;b+=.4){const[x,y]=p(a,b,9);el("ellipse",{cx:x,cy:y,rx:4,ry:2,fill:"#3A5598"})}}
colchao(1.5,1.6,2.6,1.0);
function mesa(i,j,w,d,h,toalha,borda){
  for(const[a,b]of[[i+.1,j+.1],[i+w-.2,j+.1],[i+.1,j+d-.2],[i+w-.2,j+d-.2]])caixa(a,b,.1,.1,h-4,"#555","#444","#666");
  caixa(i,j,w,d,4,toalha,borda,escurece(borda,1.1),h-4);
}
function cadeira(i,j,vira){
  for(const[a,b]of[[i,j],[i+.5,j],[i,j+.5],[i+.5,j+.5]])caixa(a,b,.08,.08,22,"#fff","#d9d9d9","#eee",0,"#9a9a9a");
  caixa(i,j,.58,.58,3,"#FFFFFF","#DCDCDC","#EEEEEE",22,"#9a9a9a");
  if(vira==="j")caixa(i,j,.58,.08,26,"#FFFFFF","#DCDCDC","#EEEEEE",25,"#9a9a9a");else caixa(i,j,.08,.58,26,"#FFFFFF","#DCDCDC","#EEEEEE",25,"#9a9a9a");
}
// truco: mesa verde com cartas e cadeiras
cadeira(10.9,3.0,"j");
mesa(10.3,3.6,1.6,1.4,32,"#5FA866","#4A8A50");
{const carta=(i,j,r)=>{const[x,y]=p(i,j,32);el("rect",{x:x-6,y:y-4,width:12,height:9,rx:1.5,fill:"#FAF9F6",stroke:"#999","stroke-width":.6,transform:`rotate(${r} ${x} ${y})`})};
 carta(10.8,4.0,-14);carta(11.2,4.3,8);carta(11.5,4.0,22);
 const[x,y]=p(10.7,4.6,32);el("rect",{x:x-3,y:y-13,width:6,height:13,rx:2,fill:"#4E7F3E"})}
cadeira(12.3,4.1,"i");
// mesa comprida (frente)
mesa(4.6,8.3,3.6,1.2,30,"#EFE3C8","#CDB78E");
for(let a=4.9;a<8.0;a+=.5){const[x,y]=p(a,8.85,30);el("circle",{cx:x,cy:y,r:3,fill:"#8A6A39",opacity:.6})}
cadeira(8.6,9.6,"j");
// colchão da frente
colchao(10.4,8.4,2.4,1.1);

// ---------- piso em destaque (o mouse está em cima)
const DEST=[6,5];
poly([p(DEST[0],DEST[1]),p(DEST[0]+1,DEST[1]),p(DEST[0]+1,DEST[1]+1),p(DEST[0],DEST[1]+1)],"rgba(255,255,255,.22)","#FFFFFF",2.5);
{const[x,y]=p(DEST[0]+.5,DEST[1]+.5);
 el("path",{d:`M${x+6} ${y-2} l0 22 l6 -6 l5 10 l4 -2 l-5 -10 l8 0 z`,fill:"#fff",stroke:"#222","stroke-width":1.5,"stroke-linejoin":"round"})}

// ---------- bonecos (14 nanicos, spritesheets prontas)
const NOMES={1:["Abreutz","abreutz"],2:["Alemão","alemao"],3:["DD","dd"],4:["Gamer","gamer"],5:["Grito","grito"],6:["Guiperino","guiperino"],7:["Le Bubu","le-bubu"],8:["Henry","henry"],9:["Pitoco","pitoco"],10:["John","john"],11:["Veião","veiao"],12:["Max","max"],13:["Gordão","gordao"],14:["Pin","pin"]};
// [n, i, j, linha(0 frente/1 costas), espelho, coluna]
const GENTE=[[4,4,4,0,0,0],[10,5,1,1,0,2],[9,9,4,0,1,0],[1,5,6,0,1,0],[12,7,3,1,1,3],[2,2,4,0,0,0],[3,12,7,0,1,0],[5,9,8,0,0,0],[6,3,9,0,0,0],[7,6,2,1,0,0],[8,11,2,0,0,0],[11,12,10,0,1,0],[13,6,7,0,0,1],[14,1,7,0,0,0]];
const EU=4;
const camada=document.getElementById("bonecos");
GENTE.sort((a,b)=>(a[1]+a[2])-(b[1]+b[2])).forEach(([n,i,j,lin,esp,col])=>{
  const[x,y]=p(i+.5,j+.5);
  el("ellipse",{cx:x,cy:y,rx:22,ry:8,fill:"rgba(0,0,0,.18)"});
  const d=document.createElement("div");d.className="bon";
  d.style.left=(x-42)+"px";d.style.top=(y-132)+"px";
  d.style.backgroundImage=`url(${BON}${NOMES[n][1]}.webp)`;d.style.backgroundPosition=`${-col*84}px ${-lin*134}px`;
  if(esp)d.style.transform="scaleX(-1)";camada.appendChild(d);
  const t=document.createElement("div");t.className="nome"+(n===EU?" eu":"");t.textContent=NOMES[n][0].toUpperCase();
  t.style.left=x+"px";t.style.top=(y-150)+"px";camada.appendChild(t);
});

function rotulo(html,i,j,z){const[x,y]=p(i,j,z);const r=document.createElement("div");r.className="rot";r.innerHTML=html;r.style.left=x+"px";r.style.top=y+"px";document.body.appendChild(r)}
